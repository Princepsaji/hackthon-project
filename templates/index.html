<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        h1 { color: #333; }
        form { margin-bottom: 20px; }
        input, textarea { display: block; margin: 5px 0; padding: 8px; width: 300px; }
        button { padding: 8px 15px; background: green; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f0f0f0; margin: 5px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>
    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Task Title" required>
        <textarea name="description" placeholder="Task Description" required></textarea>
        <button type="submit">Add Task</button>
    </form>

    <h2>All Tasks</h2>
    <ul>
        {% for task in tasks %}
        <li><b>{{ task[1] }}</b> - {{ task[2] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
